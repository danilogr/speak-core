[project]
name = "speak-core"
version = "0.4.0"
description = "The shared speech engine under the voicebox and walkie plugins, built on NVIDIA NeMo-Speech.cpp."
requires-python = ">=3.12"
dependencies = [
    "httpx2>=2.12",
]

[project.scripts]
speak-core-setup = "speak_core.setup:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/speak_core"]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=1",
    "pytest-timeout>=2.3",
    "ruff>=0.14",
    "mypy>=1.18",
]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM", "RUF", "ANN", "PTH", "LOG", "G"]
ignore = ["ANN401"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["ANN201", "ANN001"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
# Queue and lock tests wait on events rather than sleeping, so a regression that stops
# a worker hangs the test instead of failing it; this turns the hang into a red test.
timeout = 30

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src"]
